name: CI
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10' # minimum Julia version supported (must match Project.toml's compat bound)
          - '1' # latest stable 1.x release of Julia
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # [sources] alone isn't enough here: julia-buildpkg's plain
      # Pkg.instantiate()/Pkg.build() resolves SupplyChainModeling to the
      # latest *registered* release (0.2.8, which predates maximum_units/
      # overflow_unit_cost) rather than honoring the [sources] git override -
      # unlike the docs job below (Pkg.develop(path=pwd())), which does
      # correctly fix it to the git source. Force it explicitly here too,
      # regardless of that asymmetry, until a registry release makes this
      # unnecessary (see the comment on [sources] in Project.toml).
      # TEMPORARY: pinned to claude/cirrelt-2026-poultry-m1z7fv (not main) while
      # MaturationSource/QuotaSink are only on that SupplyChainModeling branch - see the
      # matching [sources] comment in Project.toml for why, and revert alongside it.
      - run: julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/SupplyChef/SupplyChainModeling.jl", rev="claude/cirrelt-2026-poultry-m1z7fv")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - run: |
          julia --project=docs -e '
            using Documenter: doctest
            using SupplyChainOptimization
            doctest(SupplyChainOptimization)'
      - run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}