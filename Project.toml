# Bumped 0.7.1 -> 0.7.2 (2026-09-17): PR #17 (claude/excelretail-supply-chain-redesign-nd0shp,
# the same branch progress_callback was ported from for 0.7.1) also carried
# lost-sales-cost-as-an-objective-term plus get_lost_sales/Lost_Sales/
# Lost_Sales_Cost visibility - genuinely never merged anywhere (checked
# directly against `main`'s source, not the comment two paragraphs down that
# claims this landed via "PR #15": that PR only merged the *earlier* nd0shp
# commits - precompile fix, PlotlyJS weak deps - not this branch's later
# work, which stayed open as PR #17 and went stale/conflicted once tariffs
# landed on top of it). Ported the same way as 0.7.1: cherry-picked the
# relevant nd0shp commits onto current `main` rather than merging PR #17
# wholesale, re-indexing lost_sales/get_financials's new lost_sales lookups
# through pidx/cidx (nd0shp predates the pidx/cidx integer-indexing
# refactor tariffs brought in, so its own code indexed lost_sales by struct
# directly - would've been a BoundsError against current `main`). Also
# ported PR #17's received[] correctness fix (pins received[] to declared
# arrivals before a lane's lead time can deliver - otherwise a customer's
# service_level was silently defeated whenever their fastest lane's lead
# time reached into period 1) since it shares the same "Lost sales" test
# coverage and is a real bug independent of the visibility work.
#
# Bumped 0.5.0 -> 0.7.0 (2026-09-15): this repo's own Project.toml version
# had drifted well behind what's actually on `main` - the branch that
# added progress_callback + folded lost_sales_cost into the objective
# (PR #15) already declared 0.6.0 internally, but the merge left main's
# own Project.toml at 0.5.0, and ad-valorem tariffs (Tariff,
# get_total_tariff_costs, this repo's Optimization.jl pricing them into
# the objective - PR #24) landed on top of that without a version bump
# either. 0.7.0 catches the declared version up to the real feature set:
# progress_callback/lost-sales-in-objective (which 0.6.0 was meant to
# cover) plus tariffs on top of it. See ExcelAtRetail.jl's PLAN.md for a
# downstream consumer that depends on this distinction behaviorally, not
# just cosmetically.
#
# CORRECTION (2026-09-17): the paragraph above is wrong about progress_callback
# specifically - checked directly against this repo's actual git history and
# source, not just the comment trail. PR #15's branch
# (claude/excelretail-supply-chain-redesign-nd0shp) never actually merged to
# `main` - it's still a separate, un-merged branch today, and `main` (and
# this branch, built from `main` after PR #24) never had
# `_register_progress_callback!`/the `progress_callback` kwarg at all. A
# downstream consumer (ExcelAtRetail.jl's run_network_optimization)
# unconditionally passes `progress_callback` to `maximize_profits!`/
# `minimize_cost!` and got a hard `MethodError` every single call as a
# result - not a "0.6.0 vs 0.7.0" versioning gap, a genuinely missing
# feature. Bumped to 0.7.1 here: ported `_register_progress_callback!` and
# the `progress_callback` kwarg from nd0shp's implementation (unchanged,
# just relocated next to this branch's extra mip_rel_gap/heuristic kwargs)
# rather than merging the two branches wholesale, since nd0shp predates
# tariffs and its own solver-tuning kwargs. HiGHS compat bumped to "1.21"
# to match - nd0shp's own [compat] comment already flagged
# CallbackFunction/HighsCallbackDataOut (what this callback mechanism
# needs) as only confirmed present from HiGHS.jl 1.21 on, and this branch's
# previous "1.7" floor predates that.
#
# SupplyChainModeling compat widened to include 0.5 for the same reason
# in that package: its own Tariff/Location.country support (and
# MaturationSource/QuotaSink before it) merged to `main` without a
# version bump, so a future 0.5.0 release there needs to already satisfy
# this bound rather than requiring another round of "Fix CI: bump stale
# SupplyChainModeling compat bound" (see this repo's own git history for
# that exact situation recurring more than once already).
#
# The tariff support this repo's Optimization.jl now depends on (Tariff,
# Location.country, get_tariff_rate, SupplyChain.tariffs) merged to
# SupplyChainModeling.jl's `main` (PR #13) but isn't registered yet, so
# point at `main` directly rather than the registry - the registered
# 0.4.0 predates this and has no `tariffs` field, which is what broke CI
# here. (This originally pointed at PR #13's own branch, but that branch
# was deleted on merge - "Did not find rev" - so it has to be `main` now
# regardless.) `main` still declares version 0.4.0, so the [compat] bound
# below needs no change. Remove this section once a new version is
# registered - see this repo's git history (e.g. "Fix CI: point
# SupplyChainModeling override at main, not a moving feature branch") for
# the same situation recurring previously.
[sources]
SupplyChainModeling = {url = "https://github.com/SupplyChef/SupplyChainModeling.jl", rev = "main"}