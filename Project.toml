# Bumped 0.5.0 -> 0.7.0 (2026-09-15): this repo's own Project.toml version
# had drifted well behind what's actually on `main` - the branch that
# added progress_callback + folded lost_sales_cost into the objective
# (PR #15) already declared 0.6.0 internally, but the merge left main's
# own Project.toml at 0.5.0, and ad-valorem tariffs (Tariff,
# get_total_tariff_costs, this repo's Optimization.jl pricing them into
# the objective - PR #24) landed on top of that without a version bump
# either. 0.7.0 catches the declared version up to the real feature set:
# progress_callback/lost-sales-in-objective (which 0.6.0 was meant to
# cover) plus tariffs on top of it. See ExcelAtRetail.jl's PLAN.md for a
# downstream consumer that depends on this distinction behaviorally, not
# just cosmetically.
#
# SupplyChainModeling compat widened to include 0.5 for the same reason
# in that package: its own Tariff/Location.country support (and
# MaturationSource/QuotaSink before it) merged to `main` without a
# version bump, so a future 0.5.0 release there needs to already satisfy
# this bound rather than requiring another round of "Fix CI: bump stale
# SupplyChainModeling compat bound" (see this repo's own git history for
# that exact situation recurring more than once already).
#
# The tariff support this repo's Optimization.jl now depends on (Tariff,
# Location.country, get_tariff_rate, SupplyChain.tariffs) merged to
# SupplyChainModeling.jl's `main` (PR #13) but isn't registered yet, so
# point at `main` directly rather than the registry - the registered
# 0.4.0 predates this and has no `tariffs` field, which is what broke CI
# here. (This originally pointed at PR #13's own branch, but that branch
# was deleted on merge - "Did not find rev" - so it has to be `main` now
# regardless.) `main` still declares version 0.4.0, so the [compat] bound
# below needs no change. Remove this section once a new version is
# registered - see this repo's git history (e.g. "Fix CI: point
# SupplyChainModeling override at main, not a moving feature branch") for
# the same situation recurring previously.
[sources]
SupplyChainModeling = {url = "https://github.com/SupplyChef/SupplyChainModeling.jl", rev = "main"}